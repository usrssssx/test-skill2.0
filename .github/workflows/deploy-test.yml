name: Deploy test

on:
  push:
    branches: [test]

permissions:
  contents: read

concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath, intl, mbstring, pcntl, redis, xml, zip
          coverage: none
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Build release contents
        env:
          VITE_BASE_PATH: /entity-test/build/
        run: |
          cp .env.example .env
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
          npm ci
          npm run build
      - name: Package immutable release
        env:
          REVISION: ${{ github.sha }}
        run: ./scripts/package-release.sh "$REVISION" ".deploy/release-$REVISION.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.sha }}
          path: |
            .deploy/release-${{ github.sha }}.tar.gz
            .deploy/release-${{ github.sha }}.tar.gz.sha256
          retention-days: 5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: test
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ github.sha }}
          path: .deploy
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy exact artifact
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          PORT: ${{ vars.DEPLOY_PORT }}
          USER: ${{ vars.DEPLOY_USER }}
          PATH_ON_SERVER: ${{ vars.DEPLOY_PATH }}
          APP_URL: ${{ vars.APP_URL }}
          PHP_BINARY: /usr/bin/php8.5
          REVISION: ${{ github.sha }}
        run: ./scripts/deploy-ci.sh test "$REVISION" ".deploy/release-$REVISION.tar.gz"
      - name: External health check
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: curl --fail --show-error --silent --retry 5 "$APP_URL/health"
