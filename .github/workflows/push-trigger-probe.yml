name: Push trigger probe

on:
  push:
    branches: [test]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm push event
        env:
          EVENT: ${{ github.event_name }}
          REVISION: ${{ github.sha }}
        run: printf 'EVENT=%s REVISION=%s\n' "$EVENT" "$REVISION"
